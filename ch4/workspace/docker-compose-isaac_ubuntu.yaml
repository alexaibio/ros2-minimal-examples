services:
  ros2:
    build:
      context: .
      dockerfile: Dockerfile

    image: ros2docker
    container_name: ros2container

    network_mode: host
    hostname: ROS2Alex
    tty: true

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ~/.Xauthority:/home/rosuser/.Xauthority:rw
      - ~/Projects_robotics/ros2-minimal-examples/ch4/workspace:/home/rosuser/ros2_ws

    runtime: nvidia

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/home/rosuser/.Xauthority
      - XDG_RUNTIME_DIR=/tmp/runtime-rosuser
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics,utility,compute

    devices:
      - /dev/dri:/dev/dri
      - /dev/snd:/dev/snd

    working_dir: /home/rosuser/ros2_ws

    command: ["/bin/bash"]

  isaac-sim:
    # Official NVIDIA image, no custom Dockerfile needed - it already
    # ships with Isaac Sim and the ROS 2 bridge extension.
    image: nvcr.io/nvidia/isaac-sim:4.2.0
    container_name: isaacsimcontainer

    network_mode: host
    hostname: IsaacSimAlex
    tty: true

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ~/.Xauthority:/root/.Xauthority:rw

      # caches/logs so Isaac Sim doesn't re-download/recompile shaders on every run
      - ~/docker/isaac-sim/cache/kit:/isaac-sim/kit/cache:rw
      - ~/docker/isaac-sim/cache/ov:/root/.cache/ov:rw
      - ~/docker/isaac-sim/cache/pip:/root/.cache/pip:rw
      - ~/docker/isaac-sim/cache/glcache:/root/.cache/nvidia/GLCache:rw
      - ~/docker/isaac-sim/cache/computecache:/root/.nv/ComputeCache:rw
      - ~/docker/isaac-sim/logs:/root/.nvidia-omniverse/logs:rw
      - ~/docker/isaac-sim/data:/root/.local/share/ov/data:rw
      - ~/docker/isaac-sim/documents:/root/Documents:rw

    runtime: nvidia

    environment:
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/root/.Xauthority
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics,utility,compute

    devices:
      - /dev/dri:/dev/dri
      - /dev/snd:/dev/snd
