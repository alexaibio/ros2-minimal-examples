services:
  ros2:
    build:
      context: .
      dockerfile: Dockerfile

    image: ros2docker
    container_name: ros2container
    hostname: ROS2Alex
    tty: true

    # DO NOT use host networking on macOS
    # network_mode: host

    volumes:
      - ~/Projects_robotics/ros2-minimal-examples/ch3/workspace:/home/rosuser/ros2_ws
      # XQuartz aithority
      - ~/.Xauthority:/home/rosuser/.Xauthority:rw

    environment:
      # XQuartz display forwarding
      - DISPLAY=host.docker.internal:0
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/home/rosuser/.Xauthority

    working_dir: /home/rosuser/ros2_ws

    command: ["/bin/bash"]